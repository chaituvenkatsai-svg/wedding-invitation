
name: Extract Wedding Website

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website ZIP
        run: |
          set -e
          ZIP="wedding-invitation-phase1.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP file not found!"
            exit 1
          fi

          mkdir -p /tmp/wedding-site
          unzip -q "$ZIP" -d /tmp/wedding-site

          python3 - <<'PY'
          from pathlib import Path
          import shutil

          extracted = Path("/tmp/wedding-site")
          items = list(extracted.iterdir())

          source = items[0] if len(items) == 1 and items[0].is_dir() else extracted

          for item in source.iterdir():
              if item.name in {".git", ".github", "wedding-invitation-phase1.zip"}:
                  continue

              target = Path.cwd() / item.name

              if item.is_dir():
                  shutil.copytree(item, target, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, target)

          print("Website files extracted successfully!")
          PY

          rm "$ZIP"

      - name: Commit website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add wedding invitation website" || echo "No changes to commit"
          git push
